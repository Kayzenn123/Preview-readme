<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" role="img" aria-label="Project 002, Jan Nihon: structured Japanese learning without the lifeless part.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}
    .gr{fill:none;stroke:#2A3340;stroke-width="1"}
    .mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.gr{stroke:#C4CCD4}
    }
  </style>
  <rect class="bg" width="800" height="400"/>
  <text class="mono ac" x="60" y="60" font-size="17" letter-spacing="3">002 &#8212; STRUCTURED</text>

  <!-- genkouyoushi manuscript grid -->
  <g>
    <rect class="gr" x="60" y="96" width="136" height="136"/>
    <line class="gr" x1="94" y1="96" x2="94" y2="232"/><line class="gr" x1="128" y1="96" x2="128" y2="232"/><line class="gr" x1="162" y1="96" x2="162" y2="232"/>
    <line class="gr" x1="60" y1="130" x2="196" y2="130"/><line class="gr" x1="60" y1="164" x2="196" y2="164"/><line class="gr" x1="60" y1="198" x2="196" y2="198"/>
    <text class="sans tx" x="128" y="208" font-size="110" font-weight="800" text-anchor="middle">&#26085;</text>
  </g>
  <!-- hanko stamp -->
  <g transform="rotate(-8 268 268)">
    <rect x="226" y="226" width="84" height="84" rx="10" fill="#E5484D"/>
    <text class="sans" x="268" y="288" font-size="56" font-weight="800" text-anchor="middle" fill="#FFFFFF">&#26085;</text>
  </g>
  <text class="mono ac" font-size="16" letter-spacing="4" transform="rotate(-90 330 200)" x="330" y="200">NIHONGO</text>
  <text class="mono sc" x="60" y="352" font-size="15">structure first. lifeless never.</text>

  <!-- copy -->
  <text class="sans tx" x="400" y="170" font-size="56" font-weight="800" letter-spacing="-1">JAN NIHON</text>
  <text class="sans sc" x="400" y="214" font-size="20">a japanese-learning platform</text>
  <text class="sans sc" x="400" y="242" font-size="20">experiment &#8212; structured,</text>
  <text class="sans sc" x="400" y="270" font-size="20">without the lifeless part.</text>
  <text class="mono ac" x="400" y="306" font-size="19">LEARN &#8599;</text>
</svg>
