<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" role="img" aria-label="Jan Nihon: learning Japanese with structure.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#8B949E}
    .gr{fill:none;stroke:#2A3340;stroke-width:1}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    .serif{font-family:Georgia,Times New Roman,serif}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.gr{stroke:#C4CCD4}
    }
  </style>
  <rect class="bg" width="800" height="400"/>
  <!-- manuscript sheet -->
  <g>
    <rect x="80" y="70" width="220" height="220" fill="none" stroke="#8B949E" stroke-width="1.5" opacity=".6"/>
    <line class="gr" x1="135" y1="70" x2="135" y2="290"/><line class="gr" x1="190" y1="70" x2="190" y2="290"/><line class="gr" x1="245" y1="70" x2="245" y2="290"/>
    <line class="gr" x1="80" y1="125" x2="300" y2="125"/><line class="gr" x1="80" y1="180" x2="300" y2="180"/><line class="gr" x1="80" y1="235" x2="300" y2="235"/>
    <text class="serif tx" x="190" y="252" font-size="150" text-anchor="middle">&#26085;</text>
  </g>
  <!-- hanko -->
  <g transform="rotate(-6 348 316)">
    <rect x="308" y="276" width="80" height="80" rx="9" fill="#C8443C"/>
    <text class="sans" x="348" y="332" font-size="52" font-weight="700" text-anchor="middle" fill="#FFFFFF">&#26085;</text>
  </g>
  <text class="serif tx" x="420" y="180" font-size="52">Jan Nihon</text>
  <text class="sans sc" x="420" y="220" font-size="20">Learning Japanese,</text>
  <text class="sans sc" x="420" y="248" font-size="20">with structure instead of grind.</text>
  <text class="sans sc" x="420" y="292" font-size="20">An ongoing experiment.</text>
</svg>
