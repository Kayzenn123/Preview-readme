<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="100%" role="img" aria-label="Zenn. I make interfaces that refuse to sit still.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}.sg{fill:#A371F7}
    .ol{fill:none;stroke:#F0F6FC;stroke-width:2.5}
    .mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes travel{from{transform:translateX(-120px)}to{transform:translateX(800px)}}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-14px,10px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    .travel{animation:travel 7s linear infinite}
    .drift{animation:drift 14s ease-in-out infinite alternate}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.ol{stroke:#1F2328}
    }
  </style>
  <rect class="bg" width="800" height="640"/>

  <!-- vertical edge meta -->
  <text class="mono sc" font-size="17" letter-spacing="3" transform="rotate(-90 40 600)" x="40" y="600">KAYZENN123 &#8212; JKT / 06&#176;S 106&#176;E</text>

  <!-- registration marks -->
  <text class="mono sc" x="748" y="72" font-size="26">+</text>
  <text class="mono ac blink" x="66" y="600" font-size="26">+</text>

  <text class="mono ac" x="92" y="112" font-size="21" letter-spacing="6">HELLO, I&#8217;M</text>

  <!-- the object: filled ZE / outline NN. bleeding off canvas -->
  <g class="drift">
    <text class="sans tx" x="78" y="372" font-size="248" font-weight="800" letter-spacing="-6">ZE</text>
    <text class="sans ol" x="428" y="372" font-size="248" font-weight="800" letter-spacing="-6">NN.</text>
  </g>

  <!-- travelling signal -->
  <g transform="translate(0,418)">
    <g class="travel">
      <line x1="0" y1="0" x2="120" y2="0" stroke-width="2" opacity=".55" stroke="#A371F7"/>
      <rect x="120" y="-8" width="16" height="16" fill="#A371F7"/>
    </g>
  </g>

  <!-- tagline under the signal path -->
  <text class="sans tx" x="92" y="478" font-size="37" font-weight="800">I make interfaces</text>
  <text class="sans tx" x="92" y="522" font-size="37" font-weight="800">that refuse to sit still.</text>

  <!-- off-grid bottom meta -->
  <text class="mono sc" x="798" y="586" font-size="20" text-anchor="end">student / creative dev / indonesia</text>
  <text class="mono sc" x="92" y="612" font-size="16" letter-spacing="3">FIG. 00 &#8212; SELF PORTRAIT, UNFINISHED</text>
</svg>
