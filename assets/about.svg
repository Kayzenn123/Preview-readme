<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="100%" role="img" aria-label="About Zenn: code meets personality. Currently building web experiments. Power levels: motion 92, TypeScript 67, sleep 12.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}.dm{fill:#4A5560}
    .rl{stroke:#21262D}.bar{fill:#21262D}
    .mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.dm{fill:#9AA4B2}.rl{stroke:#D0D7DE}.bar{fill:#E2E6EB}
    }
  </style>
  <rect class="bg" width="800" height="330"/>
  <text class="mono sc" x="60" y="52" font-size="17" letter-spacing="4">01 / STATUS</text>
  <circle class="pulse ac" cx="700" cy="46" r="6" fill="#A371F7"/>
  <text class="mono sc" x="712" y="52" font-size="16">ONLINE-ish</text>

  <text class="sans tx" x="60" y="122" font-size="42" font-weight="800" letter-spacing="-1">Code meets personality.</text>
  <text class="sans sc" x="60" y="158" font-size="20">student / creative developer / indonesia</text>
  <text class="sans sc" x="60" y="186" font-size="20">motion, composition &#38; tiny intentional details.</text>

  <line class="rl" x1="430" y1="80" x2="430" y2="300" stroke-width="1"/>

  <text class="mono sc" x="462" y="106" font-size="15" letter-spacing="3">CURRENTLY</text>
  <text class="mono tx" x="462" y="130" font-size="19">interactive web experiments</text>
  <text class="mono sc" x="462" y="162" font-size="15" letter-spacing="3">LEARNING</text>
  <text class="mono tx" x="462" y="186" font-size="19">next / ts / motion / ui systems</text>
  <text class="mono sc" x="462" y="218" font-size="15" letter-spacing="3">OBSESSION</text>
  <text class="mono ac" x="462" y="242" font-size="19">&#8220;this could look better.&#8221;</text>

  <line class="rl" x1="60" y1="214" x2="398" y2="214" stroke-width="1"/>
  <g class="mono" font-size="15">
    <text class="sc" x="60" y="244">MOTION</text>
    <rect class="bar" x="170" y="230" width="180" height="12"/><rect class="ac" x="170" y="230" width="166" height="12" fill="#A371F7"/>
    <text class="sc" x="360" y="244">92</text>
    <text class="sc" x="60" y="270">TYPESCRIPT</text>
    <rect class="bar" x="170" y="256" width="180" height="12"/><rect class="ac" x="170" y="256" width="121" height="12" fill="#A371F7"/>
    <text class="sc" x="360" y="270">67</text>
    <text class="sc" x="60" y="296">SLEEP</text>
    <rect class="bar" x="170" y="282" width="180" height="12"/><rect class="dm" x="170" y="282" width="22" height="12" fill="#4A5560"/>
    <text class="sc" x="360" y="296">12</text>
  </g>
</svg>
