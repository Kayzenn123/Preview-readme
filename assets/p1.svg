<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" role="img" aria-label="Project 001, for you apparently: an interactive memory experiment with music, photographs and motion.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}
    .fr{fill:none;stroke:#7D8590;stroke-width:2}
    .mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.fr{stroke:#59636E}
    }
  </style>
  <rect class="bg" width="800" height="400"/>
  <text class="mono sc" x="60" y="52" font-size="17" letter-spacing="4">02 / SELECTED WORK</text>
  <text class="mono ac" x="60" y="88" font-size="17" letter-spacing="3">001 &#8212; PLAYFUL</text>

  <!-- photo frames -->
  <g transform="rotate(-6 170 170)">
    <rect class="fr" x="110" y="115" width="120" height="95"/>
    <circle cx="150" cy="145" r="10" fill="#A371F7"/>
    <polygon points="110,210 160,160 190,190 205,175 230,210" fill="#7D8590" opacity=".7"/>
  </g>
  <g transform="rotate(5 270 150)">
    <rect class="fr" x="215" y="100" width="110" height="88"/>
    <circle cx="295" cy="122" r="8" fill="#F0F6FC"/>
    <polygon points="215,188 255,148 285,178 300,165 325,188" fill="#A371F7" opacity=".8"/>
  </g>
  <text class="sans ac" x="316" y="130" font-size="44" font-weight="800">&#9834;</text>

  <!-- waveform -->
  <g>
    <rect x="60" y="262" width="10" height="34" fill="#4A5560"/><rect x="76" y="250" width="10" height="58" fill="#7D8590"/>
    <rect x="92" y="238" width="10" height="82" fill="#A371F7"/><rect x="108" y="256" width="10" height="46" fill="#F0F6FC"/>
    <rect x="124" y="230" width="10" height="98" fill="#A371F7"/><rect x="140" y="246" width="10" height="66" fill="#7D8590"/>
    <rect x="156" y="262" width="10" height="34" fill="#4A5560"/><rect x="172" y="240" width="10" height="78" fill="#A371F7"/>
    <rect x="188" y="254" width="10" height="50" fill="#F0F6FC"/><rect x="204" y="232" width="10" height="94" fill="#A371F7"/>
    <rect x="220" y="258" width="10" height="42" fill="#7D8590"/><rect x="236" y="244" width="10" height="70" fill="#A371F7"/>
    <rect x="252" y="266" width="10" height="26" fill="#4A5560"/><rect x="268" y="252" width="10" height="54" fill="#F0F6FC"/>
    <rect x="284" y="236" width="10" height="86" fill="#A371F7"/><rect x="300" y="260" width="10" height="38" fill="#7D8590"/>
    <line x1="48" y1="340" x2="340" y2="340" stroke="#21262D" stroke-width="1"/>
  </g>
  <text class="mono sc" x="60" y="366" font-size="15">memories &#215; music &#215; motion, visualized</text>

  <!-- copy -->
  <text class="sans tx" x="400" y="170" font-size="56" font-weight="800" letter-spacing="-1">FOR YOU,</text>
  <text class="sans tx" x="400" y="230" font-size="56" font-weight="800" letter-spacing="-1">APPARENTLY.</text>
  <text class="sans sc" x="400" y="268" font-size="20">an interactive memory experiment &#8212;</text>
  <text class="sans sc" x="400" y="296" font-size="20">photographs, music, small moments.</text>
  <text class="mono ac" x="400" y="332" font-size="19">WEB &#8599;</text>
</svg>
