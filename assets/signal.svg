<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-label="Signal: who Zenn is, what he builds, what he obsesses over">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}
    .rl{stroke:#21262D}.mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .rise{animation:rise .9s ease backwards}
    .rise2{animation:rise .9s ease .12s backwards}
    .rise3{animation:rise .9s ease .24s backwards}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.rl{stroke:#D0D7DE}
    }
  </style>
  <rect class="bg" width="1200" height="440"/>
  <g class="mono" font-size="18" letter-spacing="4">
    <text class="sc" x="60" y="52">02 / SIGNAL</text>
    <circle class="pulse ac" cx="1124" cy="46" r="5" fill="#A371F7"/>
  </g>
  <line class="rl" x1="60" y1="78" x2="1140" y2="78" stroke-width="1"/>

  <line class="rl" x1="430" y1="110" x2="430" y2="350" stroke-width="1"/>
  <line class="rl" x1="800" y1="110" x2="800" y2="350" stroke-width="1"/>

  <g class="rise">
    <text class="mono ac" x="60" y="142" font-size="18" letter-spacing="4">ABOUT</text>
    <text class="sans tx" x="60" y="188" font-size="36" font-weight="800">Code meets</text>
    <text class="sans tx" x="60" y="230" font-size="36" font-weight="800">personality.</text>
    <text class="sans sc" x="60" y="272" font-size="20">I care about motion,</text>
    <text class="sans sc" x="60" y="300" font-size="20">composition &#38; tiny</text>
    <text class="sans sc" x="60" y="328" font-size="20">intentional details.</text>
  </g>
  <g class="rise2">
    <text class="mono ac" x="466" y="142" font-size="18" letter-spacing="4">NOW BUILDING</text>
    <text class="sans tx" x="466" y="188" font-size="36" font-weight="800">Interactive web</text>
    <text class="sans tx" x="466" y="230" font-size="36" font-weight="800">experiences.</text>
    <text class="mono sc" x="466" y="272" font-size="19">NEXT.JS / TYPESCRIPT</text>
    <text class="mono sc" x="466" y="300" font-size="19">MOTION / UI SYSTEMS</text>
  </g>
  <g class="rise3">
    <text class="mono ac" x="836" y="142" font-size="18" letter-spacing="4">CURRENT OBSESSION</text>
    <text class="sans tx" x="836" y="188" font-size="36" font-weight="800">&#8220;This could</text>
    <text class="sans tx" x="836" y="230" font-size="36" font-weight="800">look better.&#8221;</text>
    <text class="sans sc" x="836" y="272" font-size="20">Usually followed by</text>
    <text class="sans sc" x="836" y="300" font-size="20">changing everything.</text>
  </g>

  <line class="rl" x1="60" y1="372" x2="1140" y2="372" stroke-width="1"/>
  <text class="mono sc" x="60" y="408" font-size="17" letter-spacing="3">BUILD &#8594; NOTICE &#8594; QUESTION &#8594; REBUILD</text>
</svg>
