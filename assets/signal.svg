<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" role="img" aria-label="About Ahmad Zen: code meets personality. Currently building interactive web experiments.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}
    .gh{fill:#161B22}.ol{fill:none;stroke:#F0F6FC;stroke-width:2}
    .mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes travel{from{transform:translateX(-120px)}to{transform:translateX(800px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    .travel{animation:travel 7s linear infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.gh{fill:#EAECEF}.ol{stroke:#1F2328}
    }
  </style>
  <rect class="bg" width="800" height="600"/>

  <!-- giant numeral bleeding off the left edge -->
  <text class="sans gh" x="-64" y="300" font-size="330" font-weight="800" letter-spacing="-8">01</text>

  <!-- vertical annotation, right edge -->
  <text class="mono sc" font-size="17" letter-spacing="3" transform="rotate(-90 762 560)" x="762" y="560">ABOUT / AHMAD ZEN</text>

  <text class="mono ac blink" x="60" y="80" font-size="26">+</text>

  <!-- the sentence, deliberately off-grid -->
  <text class="sans tx" x="118" y="212" font-size="98" font-weight="800" letter-spacing="-2">CODE</text>
  <text class="sans ol" x="212" y="318" font-size="98" font-weight="800" letter-spacing="-2">MEETS</text>
  <text class="sans tx" x="118" y="412" font-size="72" font-weight="800" letter-spacing="-2">PERSONALITY.</text>

  <!-- travelling signal, lower than hero -->
  <g transform="translate(0,448)">
    <g class="travel">
      <line x1="0" y1="0" x2="120" y2="0" stroke-width="2" opacity=".55" stroke="#A371F7"/>
      <rect x="-16" y="-8" width="16" height="16" fill="#A371F7"/>
    </g>
  </g>

  <!-- marginalia: offset support block, bottom right -->
  <g class="mono" font-size="20">
    <text class="sc" x="400" y="492">currently &#8212; web experiments</text>
    <text class="sc" x="400" y="522">learning &#8212; next / ts / motion</text>
    <text class="tx" x="400" y="552">&#8220;this could look better.&#8221;</text>
  </g>
  <text class="mono sc" x="118" y="566" font-size="16" letter-spacing="3">FIG. 01 &#8212; SIGNAL</text>
</svg>
