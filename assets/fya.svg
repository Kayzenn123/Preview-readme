<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="For you, apparently">
  <defs>
    <clipPath id="fwipe">
      <rect x="-260" y="0" width="0" height="340" transform="skewX(-12)">
        <animate attributeName="width" dur="13s" repeatCount="indefinite"
          values="0;0;1700;1700;0" keyTimes="0;0.05;0.28;0.88;1"
          calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1;0 0 1 1;.7 0 .3 1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
    .ink{fill:#F4F1EA}.dim{fill:#8B8A93}.accent{fill:#FF5C39}
    .spin{animation:spin 9s linear infinite;transform-origin:198px 170px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>

  <rect width="1200" height="340" fill="#0A0A0C"/>
  <rect x="24" y="24" width="1152" height="292" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  <text class="mono dim" x="64" y="66" font-size="13" letter-spacing="4">SIDE PROJECT — NOT FOR THE PORTFOLIO</text>
  <line x1="64" y1="82" x2="1136" y2="82" stroke="#FFFFFF" stroke-opacity=".14"
        stroke-dasharray="1072" stroke-dashoffset="1072">
    <animate attributeName="stroke-dashoffset" dur="13s" repeatCount="indefinite"
      values="1072;1072;0;0;1072" keyTimes="0;0.02;0.2;0.88;1"
      calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1;0 0 1 1;.7 0 .3 1"/>
  </line>

  <g class="bob">
    <circle cx="198" cy="170" r="86" fill="#161616" stroke="#FFFFFF" stroke-opacity=".14"/>
    <g class="spin">
      <circle cx="198" cy="170" r="86" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="1"/>
      <circle cx="198" cy="170" r="68" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="1"/>
      <circle cx="198" cy="170" r="50" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="1"/>
      <circle cx="198" cy="170" r="32" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1"/>
    </g>
    <circle cx="198" cy="170" r="14" fill="#FF5C39"/>
    <circle cx="198" cy="170" r="3" fill="#0A0A0C"/>
  </g>

  <g clip-path="url(#fwipe)">
    <text class="serif ink" x="340" y="152" font-size="46" font-style="italic">For you, apparently.</text>
    <text class="mono dim" x="340" y="190" font-size="14" letter-spacing="1">a small thing built off the clock — memories, a few</text>
    <text class="mono dim" x="340" y="212" font-size="14" letter-spacing="1">photographs, and whatever song was playing.</text>
  </g>

  <g class="mono dim" font-size="12" letter-spacing="3">
    <text x="1136" y="66" text-anchor="end">TRACK 03</text>
  </g>
  <line x1="340" y1="248" x2="900" y2="248" stroke="#FF5C39" stroke-opacity=".5"
        stroke-dasharray="560" stroke-dashoffset="560">
    <animate attributeName="stroke-dashoffset" dur="13s" repeatCount="indefinite"
      values="560;560;0;0;560" keyTimes="0;0.3;0.46;0.9;1"
      calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1;0 0 1 1;.7 0 .3 1"/>
  </line>
  <text class="mono dim" x="340" y="278" font-size="12" letter-spacing="2">NO REPO. NO LIVE LINK. THAT'S THE POINT.</text>
</svg>
