<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" role="img" aria-label="Zenn. Currently teaching pixels manners. See you in the next commit.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#8B949E}.ac{fill:#A371F7}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    .serif{font-family:Georgia,Times New Roman,serif}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}
    }
  </style>
  <rect class="bg" width="800" height="420"/>
  <!-- the trail comes back home -->
  <path d="M400,-10 C390,40 460,60 520,70 C600,84 640,110 620,140" fill="none" stroke="#3A4350" stroke-width="2.5" stroke-dasharray="1 11" stroke-linecap="round"/>
  <text class="serif tx" x="86" y="225" font-size="150" font-weight="700" letter-spacing="-3">ZENN</text>
  <circle cx="472" cy="209" r="11" fill="#A371F7">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" keyTimes="0;.5;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M372,130 C372,100 500,100 500,132 C500,164 372,172 368,140 C365,116 470,108 496,132"
        fill="none" stroke="#E8836B" stroke-width="5" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
    <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;.12;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.7;.8;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <text class="sans sc" x="90" y="292" font-size="22">Currently: teaching pixels manners.</text>
  <text class="serif sc" x="90" y="348" font-size="30" font-style="italic">See you in the next commit.</text>
</svg>
