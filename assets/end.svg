<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="See you in the next commit">
  <style>
    .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
    .ink{fill:#F4F1EA}.dim{fill:#8B8A93}.accent{fill:#FF5C39}
    .st{opacity:0;animation:st 12s infinite}
    .st2{animation-delay:4s}.st3{animation-delay:8s}
    @keyframes st{0%{opacity:0;transform:translateX(-10px)}3%,28%{opacity:1;transform:translateX(0)}32%,100%{opacity:0;transform:translateX(6px)}}
  </style>
  <rect width="1200" height="280" fill="#0A0A0C"/>
  <line x1="64" y1="64" x2="1136" y2="64" stroke="#FFFFFF" stroke-opacity=".14"
        stroke-dasharray="1072" stroke-dashoffset="1072">
    <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite"
      values="1072;0;0;1072" keyTimes="0;0.16;0.9;1"
      calcMode="spline" keySplines=".16 1 .3 1;0 0 1 1;.7 0 .3 1"/>
  </line>

  <text class="mono dim" x="64" y="118" font-size="12" letter-spacing="4">CURRENTLY</text>
  <rect x="64" y="132" width="3" height="26" fill="#FF5C39"/>
  <g class="serif ink" font-size="27" font-style="italic">
    <text class="st" x="84" y="153">teaching pixels manners.</text>
    <text class="st st2" x="84" y="153">rebuilding the portfolio. again.</text>
    <text class="st st3" x="84" y="153">shipping small, shipping often.</text>
  </g>

  <text class="serif ink" x="1136" y="212" font-size="40" text-anchor="end">See you in the next commit<tspan class="accent">.</tspan></text>
  <text class="mono dim" x="64" y="212" font-size="12" letter-spacing="3">COLOPHON — SET IN SYSTEM SERIF</text>
  <g fill="none" stroke="#FF5C39" stroke-width="1.5">
    <path d="M1176 218 V246 H1148"/>
  </g>
</svg>
