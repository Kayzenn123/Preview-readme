<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" role="img" aria-label="Still making things. See you in the next commit.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}
    .ol{fill:none;stroke:#F0F6FC;stroke-width:2.5}.rl{stroke:#21262D}
    .mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.ol{stroke:#1F2328}.rl{stroke:#D0D7DE}
    }
  </style>
  <rect class="bg" width="800" height="400"/>
  <text class="mono sc" x="60" y="56" font-size="17" letter-spacing="4">END / NOT REALLY</text>
  <text class="sans tx" x="52" y="172" font-size="104" font-weight="800" letter-spacing="-2">STILL</text>
  <text class="sans ol" x="120" y="272" font-size="104" font-weight="800" letter-spacing="-2">MAKING</text>
  <text class="sans ac" x="52" y="372" font-size="104" font-weight="800" letter-spacing="-2">THINGS.</text>
  <line class="rl" x1="560" y1="80" x2="560" y2="360" stroke-width="1"/>
  <text class="mono tx" x="592" y="140" font-size="20">see you in</text>
  <text class="mono tx" x="592" y="168" font-size="20">the next</text>
  <text class="mono ac" x="592" y="196" font-size="20">commit &#8594;</text>
  <text class="mono sc" x="592" y="248" font-size="16">no templates.</text>
  <text class="mono sc" x="592" y="272" font-size="16">no trophies.</text>
  <text class="mono sc" x="592" y="296" font-size="16">no mercy.</text>
  <text class="mono ac blink" x="592" y="340" font-size="24">+</text>
</svg>
