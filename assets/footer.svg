<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" role="img" aria-label="Still making things. See you in the next commit.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}
    .ol{fill:none;stroke:#F0F6FC;stroke-width:2.5}
    .mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes travel{from{transform:translateX(-120px)}to{transform:translateX(800px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    .travel{animation:travel 7s linear infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.ol{stroke:#1F2328}
    }
  </style>
  <rect class="bg" width="800" height="620"/>

  <text class="mono sc" x="60" y="58" font-size="17" letter-spacing="4">END / NOT REALLY</text>
  <text class="mono ac blink" x="60" y="112" font-size="26">+</text>

  <!-- reverse-poster stack: filled / outline / violet -->
  <text class="sans tx" x="48" y="252" font-size="132" font-weight="800" letter-spacing="-3">STILL</text>
  <text class="sans ol" x="150" y="384" font-size="132" font-weight="800" letter-spacing="-3">MAKING</text>
  <text class="sans ac" x="48" y="516" font-size="132" font-weight="800" letter-spacing="-3">THINGS.</text>

  <!-- travelling signal, cursor leading this time -->
  <g transform="translate(0,556)">
    <g class="travel">
      <line x1="16" y1="0" x2="136" y2="0" stroke-width="2" opacity=".55" stroke="#A371F7"/>
      <rect x="0" y="-8" width="16" height="16" fill="#A371F7"/>
    </g>
  </g>

  <text class="mono tx" x="60" y="600" font-size="20" letter-spacing="2">SEE YOU IN THE NEXT COMMIT.</text>
</svg>
