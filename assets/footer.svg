<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="Still learning, still building, still changing things. See you in the next commit.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}
    .rl{stroke:#21262D}.mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .blink{animation:blink 1.1s steps(1) infinite}
    .rise{animation:rise .9s ease backwards}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.rl{stroke:#D0D7DE}
    }
  </style>
  <rect class="bg" width="1200" height="360"/>
  <text class="mono sc" x="60" y="56" font-size="18" letter-spacing="4">END / NOT REALLY</text>
  <line class="rl" x1="60" y1="82" x2="1140" y2="82" stroke-width="1"/>
  <text class="sans tx rise" x="60" y="188" font-size="36" font-weight="800" letter-spacing="-1">still learning &#8594; still building &#8594; still changing things</text>
  <line class="rl" x1="60" y1="238" x2="1140" y2="238" stroke-width="1"/>
  <text class="mono ac" x="60" y="296" font-size="22" letter-spacing="2">ZENN // SEE YOU IN THE NEXT COMMIT.</text>
  <rect class="blink ac" x="606" y="274" width="12" height="26" fill="#A371F7"/>
</svg>
