<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" role="img" aria-label="Project 003, next: unfinished. Loading at 37 percent.">
  <style>
    .bg{fill:#0D1117}.tx{fill:#F0F6FC}.sc{fill:#7D8590}.ac{fill:#A371F7}
    .dl{stroke:#7D8590;stroke-width:1.5}
    .mono{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.2}}.blink{animation:blink 1s steps(1) infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    @media (prefers-color-scheme: light){
      .bg{fill:#FFFFFF}.tx{fill:#1F2328}.sc{fill:#59636E}.dl{stroke:#59636E}
    }
  </style>
  <rect class="bg" width="800" height="340"/>
  <text class="mono ac" x="60" y="60" font-size="17" letter-spacing="3">003 &#8212; UNFINISHED</text>

  <!-- open construction box -->
  <line class="dl" x1="60" y1="100" x2="330" y2="100" stroke-dasharray="8 6"/>
  <line class="dl" x1="60" y1="100" x2="60" y2="260" stroke-dasharray="8 6"/>
  <line class="dl" x1="60" y1="260" x2="330" y2="260" stroke-dasharray="8 6"/>
  <text class="mono ac blink" x="292" y="130" font-size="20">+</text>
  <text class="sans tx" x="88" y="168" font-size="30" font-weight="800">next / ???</text>
  <rect x="88" y="190" width="214" height="18" fill="#21262D"/>
  <rect x="88" y="190" width="79" height="18" fill="#A371F7"/>
  <text class="mono tx" x="88" y="234" font-size="17">37% &#8212; LOADING&#8230;</text>
  <!-- hazard ticks -->
  <g>
    <polygon points="88,252 102,252 96,266 82,266" fill="#A371F7"/><polygon points="108,252 122,252 116,266 102,266" fill="#21262D"/>
    <polygon points="128,252 142,252 136,266 122,266" fill="#A371F7"/><polygon points="148,252 162,252 156,266 142,266" fill="#21262D"/>
    <polygon points="168,252 182,252 176,266 162,266" fill="#A371F7"/><polygon points="188,252 202,252 196,266 182,266" fill="#21262D"/>
  </g>

  <!-- copy -->
  <text class="sans tx" x="400" y="150" font-size="42" font-weight="800" letter-spacing="-1">&#8220;this should be simple.&#8221;</text>
  <text class="sans sc" x="400" y="186" font-size="20">&#8212; famous last words.</text>
  <text class="sans sc" x="400" y="214" font-size="20">probably another project that started</text>
  <text class="sans sc" x="400" y="242" font-size="20">exactly like that.</text>
  <text class="mono ac" x="400" y="278" font-size="19">SOON &#8212; maybe.</text>
</svg>
