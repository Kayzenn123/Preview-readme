<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Daily drivers">
  <defs>
    <clipPath id="iwipe">
      <rect x="-260" y="0" width="0" height="430" transform="skewX(-12)">
        <animate attributeName="width" dur="12s" repeatCount="indefinite"
          values="0;0;1700;1700;0" keyTimes="0;0.04;0.26;0.90;1"
          calcMode="spline" keySplines="0 0 1 1;.16 1 .3 1;0 0 1 1;.7 0 .3 1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
    .ink{fill:#F4F1EA}.dim{fill:#8B8A93}.accent{fill:#FF5C39}
  </style>

  <rect width="1200" height="430" fill="#0A0A0C"/>
  <rect x="24" y="24" width="1152" height="382" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  <text class="mono dim" x="64" y="84" font-size="13" letter-spacing="4">DAILY DRIVERS — WHAT I ACTUALLY OPEN</text>
  <line x1="64" y1="102" x2="1136" y2="102" stroke="#FFFFFF" stroke-opacity=".14"/>

  <g transform="skewX(-12)">
    <rect x="76" y="126" width="510" height="46" fill="#FF5C39" opacity="0">
      <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
        values="0 0;0 0;0 60;0 120;0 180;0 180" keyTimes="0;0.28;0.42;0.56;0.70;1"
        calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;0 0 1 1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;.12;.12;0;0" keyTimes="0;0.26;0.3;0.7;0.76;1"/>
    </rect>
    <rect x="644" y="126" width="510" height="46" fill="#FF5C39" opacity="0">
      <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
        values="0 0;0 0;0 60;0 120;0 180;0 180" keyTimes="0;0.44;0.56;0.68;0.80;1"
        calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;0 0 1 1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;.12;.12;0;0" keyTimes="0;0.42;0.46;0.82;0.88;1"/>
    </rect>
  </g>

  <g clip-path="url(#iwipe)">
    <g transform="translate(64,158)">
      <g><text class="mono accent" font-size="12" y="0">01</text><text class="serif ink" x="42" font-size="26">TypeScript</text><line x1="230" y1="-8" x2="374" y2="-8" stroke="#FFF" stroke-opacity=".2" stroke-dasharray="2 5"/><text class="mono dim" x="510" font-size="11" letter-spacing="2" text-anchor="end">TYPE SAFETY</text></g>
      <g transform="translate(0,60)"><text class="mono accent" font-size="12">02</text><text class="serif ink" x="42" font-size="26">React</text><line x1="230" y1="-8" x2="374" y2="-8" stroke="#FFF" stroke-opacity=".2" stroke-dasharray="2 5"/><text class="mono dim" x="510" font-size="11" letter-spacing="2" text-anchor="end">UI LAYER</text></g>
      <g transform="translate(0,120)"><text class="mono accent" font-size="12">03</text><text class="serif ink" x="42" font-size="26">Next.js</text><line x1="230" y1="-8" x2="374" y2="-8" stroke="#FFF" stroke-opacity=".2" stroke-dasharray="2 5"/><text class="mono dim" x="510" font-size="11" letter-spacing="2" text-anchor="end">APP FRAMEWORK</text></g>
      <g transform="translate(0,180)"><text class="mono accent" font-size="12">04</text><text class="serif ink" x="42" font-size="26">Tailwind CSS</text><line x1="230" y1="-8" x2="374" y2="-8" stroke="#FFF" stroke-opacity=".2" stroke-dasharray="2 5"/><text class="mono dim" x="510" font-size="11" letter-spacing="2" text-anchor="end">STYLING</text></g>
    </g>
    <g transform="translate(632,158)">
      <g><text class="mono accent" font-size="12">05</text><text class="serif ink" x="42" font-size="26">Supabase</text><line x1="230" y1="-8" x2="374" y2="-8" stroke="#FFF" stroke-opacity=".2" stroke-dasharray="2 5"/><text class="mono dim" x="510" font-size="11" letter-spacing="2" text-anchor="end">DATA &amp; AUTH</text></g>
      <g transform="translate(0,60)"><text class="mono accent" font-size="12">06</text><text class="serif ink" x="42" font-size="26">Node.js</text><line x1="230" y1="-8" x2="374" y2="-8" stroke="#FFF" stroke-opacity=".2" stroke-dasharray="2 5"/><text class="mono dim" x="510" font-size="11" letter-spacing="2" text-anchor="end">SERVICES</text></g>
      <g transform="translate(0,120)"><text class="mono accent" font-size="12">07</text><text class="serif ink" x="42" font-size="26">GSAP</text><line x1="230" y1="-8" x2="374" y2="-8" stroke="#FFF" stroke-opacity=".2" stroke-dasharray="2 5"/><text class="mono dim" x="510" font-size="11" letter-spacing="2" text-anchor="end">MOTION</text></g>
      <g transform="translate(0,180)"><text class="mono accent" font-size="12">08</text><text class="serif ink" x="42" font-size="26">Git</text><line x1="230" y1="-8" x2="374" y2="-8" stroke="#FFF" stroke-opacity=".2" stroke-dasharray="2 5"/><text class="mono dim" x="510" font-size="11" letter-spacing="2" text-anchor="end">VERSION CONTROL</text></g>
    </g>
  </g>
</svg>
